[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-autoresearch-v3"
version = "0.1.0"
description = "Baseline-plus-fallback autoresearch loop for manufacturing scheduling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.50",
  "openai>=1.100.0",
  "pulp>=2.8.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.5",
  "rich>=13.7.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
